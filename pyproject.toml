[project]
name = "maptoposter"
version = "0.1.0"
description = "Generate beautiful map posters for any city"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "osmnx>=2.0.0",
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "geopy>=2.4.0",
    "tqdm>=4.60.0",
]

[project.scripts]
maptoposter = "maptoposter.create_map_poster:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maptoposter"]
